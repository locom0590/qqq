// Profil sadece bu cihazda saklanır (localStorage). Bazı önizleme ortamlarında
// localStorage kapalı olabilir; o durumda sessizce oturum içi çalışır.
// FIX: anahtar v2'ye çıkarıldı — v1 profillerinde rıza tarihi/sürümü yoktu,
// bu yüzden eski kayıtlar geçersiz sayılıp onboarding tekrar gösteriliyor.
const PROFILE_KEY = "reacto.profile.v2";
// FIX (KVKK): rıza metnini her değiştirdiğinde bu sayıyı artır ki eski rızalar
// otomatik geçerli sayılmasın. consentAt ile birlikte rızayı ispat edilebilir kılar.
const CONSENT_VERSION = 1;
const loadProfile = () => {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    // FIX: rıza metni güncellendiyse profili geçersiz say, yeniden sor.
    if (!p || p.consentVersion !== CONSENT_VERSION) return null;
    // Takım kimlikleri değişti (volt/sinyal/itki/sogutma → cikis/kale/pist/ring).
    // Eskisini taşıyan profil takım seçimini tekrar yapsın, aksi halde renk/motif
    // bulunamayıp arayüz varsayılana düşer.
    if (p.team && !teamOf(p.team)) return null;
    return p;
  }
  catch (e2) { return null; }
};
const saveProfile = (p) => { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e3) {} };
const clearProfile = () => { try { localStorage.removeItem(PROFILE_KEY); } catch (e4) {} };

// Gönderim: yalnızca onay verilmiş + 18 yaş üstü + STATS_URL tanımlı ise.
// Kimlik yok, çerez yok, saat yok (yalnızca gün). Hata sessizce yutulur.
const sendStats = (profile, payload) => {
  if (!STATS_URL) return;
  if (!profile || profile.consent !== "accepted" || profile.ageRange === "u18") return;
  const body = JSON.stringify({
    ...payload,
    ageRange: profile.ageRange,
    team: profile.team,
    day: new Date().toISOString().slice(0, 10),
    consentVersion: CONSENT_VERSION,
  });
  try {
    if (navigator.sendBeacon) {
      // FIX: "application/json" CORS preflight tetikler ve sendBeacon preflight yapamaz —
      // istek sessizce düşerdi. text/plain "simple request" olduğu için preflight'sız gider.
      // SUNUCU TARAFI: gövdeyi Content-Type'a bakmadan JSON olarak parse et.
      const ok = navigator.sendBeacon(STATS_URL, new Blob([body], { type: "text/plain;charset=UTF-8" }));
      if (ok) return;
    }
    fetch(STATS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=UTF-8" }, body, keepalive:true }).catch(()=>{});
  } catch (e5) {}
};

const median = (arr) => { const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2 ? s[m] : Math.round((s[m-1]+s[m])/2); };

const PCT = {
  tap:  [[180,99.7],[200,99],[230,96],[250,92],[280,83],[300,74],[330,62],[360,52],[400,39],[450,26],[500,17],[600,7],[750,2],[1000,0.5]],
  tilt: [[280,99.5],[320,97],[375,90],[420,78],[470,64],[520,52],[575,40],[650,26],[750,14],[900,6],[1100,2],[1300,0.8]],
};
function percentileFaster(test, ms) {
  const pts = PCT[test];
  if (ms <= pts[0][0]) return pts[0][1];
  for (let i=1;i<pts.length;i++){ if(ms<=pts[i][0]){ const[a,b]=pts[i-1],[c,d]=pts[i]; return b+(d-b)*(ms-a)/(c-a);} }
  return 0.3;
}

// FIX: açı farkını [-180, 180] aralığına sarar.

const normAngle = (d) => ((d + 540) % 360) - 180;

// FIX: cihaz eksenlerini ekran eksenlerine çevirir.
// screen.orientation.angle içeriğin doğal yöne göre dönüşüdür.
const screenAngle = () => {
  const so = window.screen && window.screen.orientation;
  if (so && typeof so.angle === "number") return so.angle;
  if (typeof window.orientation === "number") return (window.orientation + 360) % 360;
  return 0;
};
const toScreenAxes = (beta, gamma) => {
  switch (screenAngle()) {
    case 90:  return { x: -beta,  y:  gamma };
    case 180: return { x: -gamma, y: -beta  };
    case 270: return { x:  beta,  y: -gamma };
    default:  return { x:  gamma, y:  beta  };
  }
};

const blankTestState = () => ({ history: [], best: null, official: [], wrong: 0, cert: null });

function Reacto() {

  const timerRef = useRef(null);

  const lockRef = useRef(false);

  const clearTimers = useCallback(() => {

  const accent = myTeam ? myTeam.color : "#8EA3FF";

  // ---- Sensör ----
  const lastUiTiltRef = useRef(0);

    if (e.beta === null || e.gamma === null) return;

<script>
// =============== ESKİ SERVICE WORKER TEMİZLİĞİ ===============
// PWA kaldırıldı. Ama siteyi DAHA ÖNCE ziyaret etmiş kullanıcıların
// tarayıcısında eski service worker hâlâ kurulu ve önbellekten servis etmeye
// devam ediyor — kaydı silmek onu kaldırmaz. O kullanıcılar yeni sürümü asla
// görmez. Aşağıdaki blok bunu bir kez temizler ve sonra hiçbir şey yapmaz.
//
// Siteyi hiç yayına almadıysan bu bloğu silebilirsin.
// Yayındaysan birkaç ay bırak (kullanıcıların tekrar uğraması için), sonra sil.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then((regs) => {
      if (!regs.length) return;
      return Promise.all(regs.map((r) => r.unregister())).then(() => {
        // Eski önbellekleri de boşalt, yoksa disk üzerinde öylece durur.
        if (!window.caches) return;
        return caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k))));
      }).then(() => {
        // SW kaldırıldı ama bu sayfa hâlâ onun servis ettiği eski sürüm olabilir.
        // Tek seferlik yenile; sessionStorage bayrağı sonsuz döngüyü engeller.
        try {
          if (!sessionStorage.getItem("reacto.swCleared")) {
            sessionStorage.setItem("reacto.swCleared", "1");
            window.location.reload();
          }
        } catch (e) {}
      });
    })
    .catch(() => {});
}
